name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.9-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.9
          NOTES=$'HID 事件抓取诊断 v1.0.9（roothide 直装）\n\n【本次更新】\n1. 修复设置页加载失败：v1.0.8 用了 CFNotificationCenterGetDarwinCenter（macOS 私有符号，iOS 不存在）\n   → dlopen 报 symbol not found in flat namespace。\n   改为同进程直接调用：设置页按钮与 Tweak 在同一 Preferences 进程，extern 直接调 SnifWriteDiagnostics()\n   （与一直正常工作的 SnifLogPath() 同一机制）\n2. 「重启插件」按钮逻辑不变：清空日志 → 立即重写全部 [诊断] 行 → 自动刷新\n\n【架构】只注入 Preferences：设置 → HIDEventSniffer → 日志页（手动刷新）\n\n【怎么测】安装 → 注销 → 设置 → HIDEventSniffer 能正常打开 → 点「重启插件」看诊断行重新出现，\n然后手指+翻页器按键，点「刷新日志」看每行 id=0x..。只记录、不改变任何操作。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.9" --notes "$NOTES"
          fi
