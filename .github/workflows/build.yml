name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.4-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.4
          NOTES=$'HID 事件抓取诊断 v1.0.4（roothide 直装）\n\n【本次更新】触摸类型全分辨：\n- TOUCH 相位中文化：按下/移动/静止/弹起/取消\n- 记录拖动路径（移动轨迹，限流 100ms）\n- 弹起时自动判定：单击 / 连点N次 / 长按 / 拖动滑动（按位移与时长）\n- PRESS 键盘键相位也中文化（按下/弹起）\n\n【架构】只注入 Preferences：设置 → HIDEventSniffer → 日志页（自动刷新）\n打开设置页，用翻页器按键（音量+/-、四方向、点击），日志实时显示。\n\n【怎么测】安装 → 注销 → 进设置 → HIDEventSniffer → 分别用：手指单击、拖动、长按、\n以及翻页器每个按钮按键 → 看日志怎么分辨。只记录、不改变任何操作。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.2" --notes "$NOTES"
          fi
