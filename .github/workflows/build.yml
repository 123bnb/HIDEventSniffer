name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.7-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.7
          NOTES=$'HID 事件抓取诊断 v1.0.7（roothide 直装）\n\n【本次更新】\n1. 设备特征钉死：事件日志追加 vendorID/productID（vid=0x.. pid=0x..）——设备固件写死的，重启/重连不变，是认住翻页器的稳定身份证\n2. 诊断行固定头部：所有以 [诊断] 开头的行固定在日志顶部不被事件刷掉，事件日志最新在上\n3. 取消自动刷新：改为手动点「刷新日志」，不再 0.6s 轮询\n4. 新增 IOBluetooth 私有框架探测已配对设备，与 BluetoothManager 对比，看哪个能见到翻页器\n\n【架构】只注入 Preferences：设置 → HIDEventSniffer → 日志页（手动刷新）\n\n【怎么测】安装 → 注销 → 进设置 → HIDEventSniffer → 顶部看诊断行（IOBluetooth/BluetoothManager 设备列表），\n然后分别用手指和翻页器按键，点「刷新日志」看每行：设备=屏幕/外部HID id=0x.. vid=0x.. pid=0x..。只记录、不改变任何操作。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.7" --notes "$NOTES"
          fi
