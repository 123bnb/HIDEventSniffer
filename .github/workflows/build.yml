name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.3-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.3
          NOTES=$'HID 事件抓取诊断 v1.0.3（roothide 直装，用户方案版）\n\n【架构】只注入 Preferences 一个进程（系统设置 App）：\n- 系统设置 → HIDEventSniffer → 极简设置页（自动刷新日志 + 刷新按钮 + 清空）\n- 打开设置页，用蓝牙翻页器直接按键（音量+/-、四方向、点击），日志实时显示在设置页里\n- 不再碰 SpringBoard，安全模式风险归零\n\n【日志】Preferences 沙盒 Documents/HIDEventSniffer.log（设置页直接读），\n权限允许时同时写 /var/mobile/Documents/HIDEventSniffer.log。\n\n【怎么测】安装 → 注销 → 进设置 → HIDEventSniffer → 用翻页器按键 → 看日志实时刷新。\n只记录、不改变任何操作，可随时卸载。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.2" --notes "$NOTES"
          fi
