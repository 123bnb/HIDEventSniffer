name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.6-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.6
          NOTES=$'HID 事件抓取诊断 v1.0.6（roothide 直装）\n\n【本次更新】设备溯源多路探测（修 v1.0.5 全部显示 设备=未知）：\n- 取底层 HID 事件从单一路径改为 3 路探测：KVC(_hidEvent/hidEvent) → ivar 偏移直读 → 从 UITouch 取\n- 用 IOHIDEventGetTypeID 验证取到的事件合法性，防止误读\n- 日志始终显示 senderID 原始值 + HID 事件类型（屏幕和蓝牙 ID 必不同，即使 uniqueID 拿不到也能区分）\n- 启动时打印 UIEvent/UITouch 所有含 hid/event 的 ivar 名和类型（诊断依据）\n- 保留触摸类型判定（按下/移动/弹起/取消 + 单击/连点/长按/拖动）\n\n【架构】只注入 Preferences：设置 → HIDEventSniffer → 日志页（自动刷新）\n\n【怎么测】安装 → 注销 → 进设置 → HIDEventSniffer → 分别用手指和翻页器按键，\n日志会显示每行事件开头：设备=屏幕/蓝牙HID/外部HID id=0x.. hidType=..。只记录、不改变任何操作。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.2" --notes "$NOTES"
          fi
