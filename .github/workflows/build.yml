name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.8-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.8
          NOTES=$'HID 事件抓取诊断 v1.0.8（roothide 直装）\n\n【本次更新】\n1. 新增「重启插件」按钮：清空日志后点它，插件立刻重写诊断信息（等同插件重新初始化），不用注销/重启手机\n   —— 通过 darwin 通知实现，Tweak 收到后清空日志文件并重新写入全部 [诊断] 行\n2. 按钮区改为三个：刷新日志 / 清空 / 重启插件\n3. 说明：vid/pid 在 App 层读到的都是 0x0（UIKit 转发事件时被系统清零，VID/PID 只有 backboardd 底层才有）；\n   可用指纹是 senderID（id=0x..），不同设备固定且不同\n\n【架构】只注入 Preferences：设置 → HIDEventSniffer → 日志页（手动刷新）\n\n【怎么测】安装 → 注销 → 进设置 → HIDEventSniffer → 点「重启插件」看诊断行重新出现，\n然后手指+翻页器按键，点「刷新日志」看每行 id=0x..。只记录、不改变任何操作。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.8" --notes "$NOTES"
          fi
