name: Build HIDEventSniffer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Theos (roothide fork)
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"

      - name: Get iOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dpkg & ldid
        run: brew install dpkg ldid

      - name: Build roothide deb
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide
          echo "===== 产物 ====="
          ls -la packages/
          DEB=$(ls packages/*.deb | head -1)
          echo "deb=$DEB"
          dpkg-deb -f "$DEB" | grep -E '^(Package|Version|Architecture):'

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(ls packages/*.deb | head -1)
          DEB=HIDEventSniffer-1.0.5-roothide.deb
          cp "$RAW" "$DEB"
          TAG=v1.0.5
          NOTES=$'HID 事件抓取诊断 v1.0.5（roothide 直装）\n\n【本次更新】设备溯源：\n- 每个事件标记来源设备：屏幕(手指) / 蓝牙HID(含设备id=0x.. 和 uniqueID) / 其它外部HID\n- 设置页顶部显示当前已连接蓝牙设备（名称+地址），对照日志里的 id/uid 即可确认翻页器\n- 保留 v1.0.4 的触摸类型判定（按下/移动/弹起/取消 + 单击/连点/长按/拖动）\n\n【架构】只注入 Preferences：设置 → HIDEventSniffer → 日志页（自动刷新）\n\n【怎么测】安装 → 注销 → 进设置 → HIDEventSniffer → 看顶部蓝牙设备列表，\n然后分别用手指和翻页器按键，日志会标明每个事件的来源设备。只记录、不改变任何操作。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "HIDEventSniffer v1.0.2" --notes "$NOTES"
          fi
